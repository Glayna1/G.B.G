name: Apply G.B.G 1.8.26 to main

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.issue.title == 'Apply G.B.G 1.8.26'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Apply G.B.G 1.8.26
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/GBG_1.8.26_newpart* > /tmp/GBG_1.8.26_patch.b64
          base64 --decode /tmp/GBG_1.8.26_patch.b64 > /tmp/GBG_1.8.26_patch.zip
          echo "199998e35d1f0a5243056e5fd1949008158aeb0afe9b010a36d8a7bfaa11e460  /tmp/GBG_1.8.26_patch.zip" | sha256sum --check
          unzip -oq /tmp/GBG_1.8.26_patch.zip -d .
          grep -q '^## Version: 1.8.26' GBG/GBG.toc
          grep -q '^## Interface: 30300' GBG/GBG.toc
          test -f GBG/AntiSpam.lua
          test -f GBG/Minimap.lua
          test -f GBG/Performance.lua
          test -f GBG/RecruitmentAuthority.lua
          test -f GBG/Runtime.lua
          test -f GBG/StartupState.lua
          test -f GBG/Media/GBG_Minimap.tga

          rm -rf .bootstrap
          rm -f GBG/GBG.toc.__tmp1826 GBG/GBG.toc.__tmp1826b64
          rm -f .github/workflows/apply-gbg-1.8.26.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update G.B.G to 1.8.26"
          git push origin main
