name: Restore complete G.B.G addon

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/restore-complete-addon.yml"
  pull_request:
    branches:
      - main

permissions:
  contents: write
  pull-requests: read

jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Restore complete addon and apply 1.8.11
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/gbg-restore
          mkdir -p /tmp/gbg-restore

          # Restore every source/media file from the historical complete archive.
          git show 938583890c8e3a820bb8d9f40cf69788709689b9:GBG_1.8.6.zip > /tmp/GBG_1.8.6.zip
          unzip -q /tmp/GBG_1.8.6.zip -d /tmp/gbg-restore
          test -d /tmp/gbg-restore/GBG
          rm -rf GBG
          cp -a /tmp/gbg-restore/GBG ./GBG

          # Overlay every non-media file from the supplied 1.8.11 package.
          test -f .bootstrap/GBG_1.8.11_code.b64
          base64 --decode .bootstrap/GBG_1.8.11_code.b64 > /tmp/GBG_1.8.11_code.zip
          echo "15de3d049d48d08372a8a63fd3f46ff5c7118506c933b2a06fc7c26c43e13f5a  /tmp/GBG_1.8.11_code.zip" | sha256sum --check
          unzip -oq /tmp/GBG_1.8.11_code.zip -d .

          # Final installability checks.
          test -f GBG/GBG.toc
          grep -q '^## Version: 1.8.11' GBG/GBG.toc
          test "$(find GBG -type f | wc -l | tr -d ' ')" -eq 229
          test "$(find GBG -type f -iname '*.tga' | wc -l | tr -d ' ')" -ge 200

          rm -rf .bootstrap
          rm -f .restore-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish complete G.B.G 1.8.11 addon"
          git push origin "HEAD:${{ github.head_ref || github.ref_name }}"
